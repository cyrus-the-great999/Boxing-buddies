function renderSheet(){var sh=$('#sheet');if(!sh)return;var was=sh.dataset.open==='1',pn=sh.querySelector('.panel'),st=pn?pn.scrollTop:0;sh.hidden=!sheet;sh.dataset.open=sheet?'1':'0';if(!sheet){sh.innerHTML='';return}sh.innerHTML='<div class="scrim" data-s="close"></div><div class="panel'+(was?'':' in')+'">'+(sheet==='f'?filtersView():settingsView())+'</div>';sh.querySelector('.panel').scrollTop=st}
function av(sm){return '<i class="pav'+(sm?' sm':'')+'">'+(me.photo?'<img alt="" src="'+me.photo+'">':esc((me.n||'?')[0].toUpperCase()))+'</i>'}

function profRow(){return '<div class="group" style="margin-top:14px"><button class="srow link" data-s="profile"><span style="display:flex;align-items:center;gap:12px;color:var(--ink);font-size:16px;font-weight:600">'+av(1)+esc(me.n||'Set up your profile')+'</span></button></div>'}
var evDraft={},evErr='',picErr='';
function evFormHtml(){var q=function(t){return esc(t||'').replace(/"/g,'&quot;')};return '<div class="group" style="padding:14px 16px;margin-bottom:12px"><label class="meta" style="display:block">Meetup name<input id="evn" class="fld" value="'+q(evDraft.n)+'" placeholder="Sparring night"'+(evErr?' aria-invalid="true"':'')+'></label><label class="meta" style="display:block;margin-top:10px">Where<select id="evw" class="fld">'+GYMS.map(function(g){return '<option'+(g.n===evDraft.w?' selected':'')+'>'+g.n+'</option>'}).join('')+'<option'+(evDraft.w==='Other location'?' selected':'')+'>Other location</option></select></label><div style="display:flex;gap:8px"><label class="meta" style="flex:1;margin-top:10px">Date<input id="evd" type="date" class="fld" value="'+(evDraft.d||new Date().toISOString().slice(0,10))+'"></label><label class="meta" style="flex:1;margin-top:10px">Time<input id="evt" type="time" class="fld" value="'+(evDraft.t||'')+'"></label></div>'+'<label class="meta" style="display:block;margin-top:10px">Cover photo (optional, cropped to a 640 by 640 square)<input id="evcov" type="file" accept="image/*" class="fld"></label>'+(evDraft.cov?'<img class="cov" alt="Cover preview" src="'+evDraft.cov+'">':'')+(evErr?'<p class="err" role="alert">'+evErr+'</p>':'')+'<button class="btn" data-s="evsave">Save meetup</button></div>'}
function saveEvent(){var g=function(i){return document.getElementById(i)},n=g('evn').value.trim(),d=g('evd').value,t=g('evt').value;evDraft={n:n,w:g('evw').value,d:d,t:t,cov:evDraft.cov};if(!n){evErr='Give your meetup a name.';render();return false}if(!d){evErr='Pick a date for your meetup.';render();return false}var dt=new Date(d+'T'+(t||'12:00')),ds=dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+(t?' at '+dt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):''),id='u'+Date.now();myEv.unshift({id:id,n:n,w:g('evw').value,d:ds,c:0,cov:evDraft.cov||''});rsvp[id]=true;evForm=false;evErr='';evDraft={};return true}
document.addEventListener('change',function(e){if(e.target.id!=='pic')return;var fl=e.target.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas'),k=Math.min(1,480/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);me.photo=c.toDataURL('image/jpeg',.8);picErr='';render()};im.onerror=function(){picErr='That file could not be read as a photo. Try a JPG or PNG.';render()};im.src=r.result};r.onerror=function(){picErr='That file could not be read. Try another photo.';render()};r.readAsDataURL(fl)});
document.addEventListener('change',function(e){if(e.target.id!=='evcov')return;var fl=e.target.files[0];if(!fl)return;var keep=function(){var n=document.getElementById('evn'),w=document.getElementById('evw'),d=document.getElementById('evd'),t=document.getElementById('evt');evDraft.n=n?n.value:evDraft.n;evDraft.w=w?w.value:evDraft.w;evDraft.d=d?d.value:evDraft.d;evDraft.t=t?t.value:evDraft.t};keep();var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var S=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=640;c.getContext('2d').drawImage(im,(im.width-S)/2,(im.height-S)/2,S,S,0,0,640,640);evDraft.cov=c.toDataURL('image/jpeg',.8);evErr='';render()};im.onerror=function(){evErr='That file could not be read as a photo. Try a JPG or PNG.';render()};im.src=r.result};r.onerror=function(){evErr='That file could not be read. Try another photo.';render()};r.readAsDataURL(fl)});
var msgQ='',typing={},info=false;
function ago(ts){if(!ts)return '';var m=Math.max(0,Math.round((Date.now()-ts)/60000));if(m<1)return 'now';if(m<60)return m+'m';var h=Math.round(m/60);if(h<24)return h+'h';return Math.round(h/24)+'d'}
function tsl(ts){var d=new Date(ts),t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});return d.toDateString()===new Date().toDateString()?t:d.toLocaleDateString([],{weekday:'short'})+' '+t}
function lastOf(id){var c=chats[id]||[];return c[c.length-1]||{t:''}}
function avt(p,sz){return '<span class="av'+(sz?' '+sz:'')+'" style="background:'+col(p)+'">'+ini(p)+'</span>'}
function convoRows(){
  if(!matches.length)return '<div class="empty"><h2>No messages yet</h2><p>Swipe right on a boxer. If they want to spar too, you can message them here.</p></div>';
  var q=msgQ.trim().toLowerCase();
  var ids=matches.filter(function(id){return !q||D[id-1].n.toLowerCase().indexOf(q)>=0}).sort(function(a,b){return (lastOf(b).ts||0)-(lastOf(a).ts||0)});
  if(!ids.length)return '<p class="note">No boxers found for '+esc(msgQ)+'.</p>';
  return ids.map(function(id){var p=D[id-1],l=lastOf(id),un=unread[id];return '<button class="dm'+(un?' un':'')+'" data-chat="'+id+'">'+avt(p)+'<span class="dmt"><b>'+p.n+'</b><span class="sub"><span class="pv">'+(l.me?'You: ':'')+esc(l.t)+'</span><span class="tm">'+ago(l.ts)+'</span></span></span>'+(un?'<i class="ud" aria-label="Unread"></i>':'')+'</button>'}).join('');
}
function newRow(){
  var ids=matches.filter(function(id){return (chats[id]||[]).every(function(m){return !m.me})});
  if(!ids.length)return '';
  return '<p class="sh" style="margin:2px 6px 8px">New matches</p><div class="story">'+ids.map(function(id){var p=D[id-1];return '<button class="st" data-chat="'+id+'"><span class="ring'+(unread[id]?' on':'')+'">'+avt(p,'lg')+'</span><span>'+p.n.split(' ')[0]+'</span></button>'}).join('')+'</div>';
}
function sessHtml(){if(!sess.length)return '';return '<p class="sh">Booked sessions</p>'+sess.map(function(x){var p=D[x.id-1];return '<div class="gym"><b>'+p.n+'</b><p class="meta">'+x.t+' at '+p.gym+'</p></div>'}).join('')}
function matchList(){
  return '<h2 class="big" style="margin-bottom:12px">Messages</h2><label class="sq"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="msq" placeholder="Search" aria-label="Search messages" value="'+esc(msgQ).replace(/"/g,'&quot;')+'"></label>'+newRow()+'<div id="mlist">'+convoRows()+'</div>'+sessHtml();
}
function chatView(){
  var p=D[openId-1],c=chats[openId],lastMe=-1,i;
  for(i=c.length-1;i>=0;i--){if(c[i].me){lastMe=i;break}}
  var h='<div class="ch"><button class="ic" id="back" aria-label="Back to messages"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>'+avt(p,'sm')+'<span class="cht"><b>'+p.n+'</b><span>'+p.gym+'</span></span><button class="ic" data-act="info" aria-label="Book a session" aria-expanded="'+info+'"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button></div>';
  if(info)h+='<div class="group" style="padding:12px 14px;margin-bottom:8px">'+chatTools(p)+'</div>';
  h+='<div class="chat"><div class="msgs" id="msgs">';
  c.forEach(function(m,j){
    var pr=c[j-1],nx=c[j+1];
    if(m.ts&&(!pr||!pr.ts||m.ts-pr.ts>10800000))h+='<p class="tsl">'+tsl(m.ts)+'</p>';
    if(m.me)h+='<div class="mr me"><div class="m me">'+esc(m.t)+'</div></div>';
    else h+='<div class="mr">'+((!nx||nx.me)?avt(p,'xs'):'<span class="avs"></span>')+'<div class="m">'+esc(m.t)+'</div></div>';
  });
  if(typing[openId])h+='<div class="mr">'+avt(p,'xs')+'<div class="m" aria-label="Typing"><span class="td"></span><span class="td"></span><span class="td"></span></div></div>';
  else if(lastMe>=0)h+='<p class="seen">'+(lastMe<c.length-1?'Seen':'Sent')+'</p>';
  return h+'</div><div class="send"><input id="txt" placeholder="Message..." aria-label="Message"><button id="send">Send</button></div></div>';
}
var seeded=false;
function seed(){
  if(seeded||matches.length)return;
  var T=Date.now(),M=60000;
  var S=[
   [9,[{t:'Hey! Quick question, do you spar southpaw or orthodox?',ts:T-300*M}],0],
   [17,[{t:'I saw you like high-output rounds too. Down to try Thursday?',ts:T-8*M}],1],
   [12,[{t:'Matched! Which gym do you usually train at?',ts:T-300*M},{t:'TITLE in Marlborough. You?',me:1,ts:T-280*M},{t:'Upperkuts in Ashland, so we are close. Want to trade rounds next week?',ts:T-45*M}],1],
   [1,[{t:'Hey, saw you want a training partner too. Technical sparring, light to medium is what I am after.',ts:T-1500*M},{t:'Same here. I am usually free Tuesday evenings.',me:1,ts:T-1480*M},{t:'Tuesday at 7 works for me. Technical pace, 60 to 70 percent?',ts:T-1440*M}],1],
   [11,[{t:'Hey, good to match. What level are you at right now?',ts:T-3000*M},{t:'Intermediate, about two years in.',me:1,ts:T-2990*M},{t:'Perfect. Bring a mouthguard and your own wraps.',ts:T-2900*M},{t:'Will do. See you Friday.',me:1,ts:T-2880*M}],0]
  ];
  S.forEach(function(x){D[x[0]-1].done=1;matches.push(x[0]);chats[x[0]]=x[1];if(x[2])unread[x[0]]=1});
  seeded=true;
}
